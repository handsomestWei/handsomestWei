# fork form https://github.com/Platane/Platane/blob/master/.github/workflows/main.yml
name: generate animation

on:
  # run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      # generate static stats cards locally via GitHub API (no public vercel instance)
      - name: generate github-readme-stats.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: dist/github-readme-stats.svg
          token: ${{ secrets.TOKEN }}
          fail_on_error: true
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&show_fork=true&hide_contribs=true&theme=buefy&hide_border=true

      - name: generate github-readme-top-langs.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: dist/github-readme-top-langs.svg
          token: ${{ secrets.TOKEN }}
          fail_on_error: true
          options: username=${{ github.repository_owner }}&layout=compact&theme=buefy&hide_border=true

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push generated svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
